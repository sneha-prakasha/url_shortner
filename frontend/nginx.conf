# One public port (80) for everything:
#   /app/...      -> React files (this container)
#   /api/...      -> FastAPI container
#   /<short-code> -> FastAPI container (the redirect)
server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Visiting the bare domain opens the app
    location = / {
        return 302 /app/;
    }

    # "/app" without the slash must NOT be treated as a short code
    location = /app {
        return 301 /app/;
    }

    # Hashed build files can be cached "forever"
    location /app/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # React single-page app: unknown paths fall back to index.html
    location /app/ {
        add_header Cache-Control "no-cache";
        try_files $uri /app/index.html;
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Anything that looks like a short code: /aB3x9, /sneha-resume
    location ~ ^/[A-Za-z0-9_-]+$ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
